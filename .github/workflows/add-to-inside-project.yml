name: Inside tracker

on:
  issues:
    types: [opened, reopened, transferred, labeled, unlabeled, closed, assigned, unassigned]
  pull_request_target:
    types: [opened, reopened, closed, ready_for_review, converted_to_draft, edited]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply verified changes (otherwise report only)
        type: boolean
        default: false
      issue:
        description: Optional repository#number for bounded verification
        type: string
        default: ''

permissions:
  contents: read

# Repository events are coalesced; the central scheduled sweep repairs missed events.
concurrency:
  group: inside-tracker-${{ github.event.issue.node_id || github.event.pull_request.node_id || 'sweep' }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name != 'schedule' || github.repository == 'sachkov-inside/workspace'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Never execute PR head/merge code in the token-bearing metadata workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile current facts
        env:
          GH_TOKEN: ${{ secrets.INSIDE_PROJECT_TOKEN }}
          TRACKER_APPLY: ${{ inputs.apply }}
          TRACKER_ISSUE: ${{ inputs.issue }}
          TRACKER_ENABLED: ${{ vars.INSIDE_TRACKER_APPLY }}
        run: |
          set -euo pipefail
          python3 .github/scripts/tracker_event.py > tracker-report.jsonl
      - name: Preserve report, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracker-report
          path: tracker-report.jsonl
          if-no-files-found: error
