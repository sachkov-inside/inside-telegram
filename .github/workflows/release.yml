name: Publish ordinal release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Next ordinal release (vN)
        required: true
        type: string

permissions: {}

concurrency:
  group: telegram-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Check out captured source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Require the next ordinal on the current main
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash scripts/plan-release.sh >"$RUNNER_TEMP/release-plan.json"
          source_sha="$(jq --exit-status --raw-output .sourceSha "$RUNNER_TEMP/release-plan.json")"
          version="$(jq --exit-status --raw-output .version "$RUNNER_TEMP/release-plan.json")"
          echo "source_sha=$source_sha" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"

  ci:
    needs: plan
    permissions:
      contents: read
    uses: ./.github/workflows/application-ci.yml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}

  image:
    needs: [plan, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out captured source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push the exact source
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/production/Dockerfile
          push: true
          build-args: |
            SOURCE_COMMIT=${{ needs.plan.outputs.source_sha }}
          tags: ghcr.io/sachkov-inside/inside-telegram:${{ needs.plan.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
          provenance: false
          sbom: false
      - name: Prove anonymous pull by digest
        env:
          IMAGE: ghcr.io/sachkov-inside/inside-telegram@${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          docker logout ghcr.io
          if ! docker pull "$IMAGE"; then
            echo "::error::The GHCR package must be public: set Package settings → Danger Zone → Change visibility → Public, then re-run failed jobs."
            exit 1
          fi
          revision="$(docker image inspect "$IMAGE" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [[ "$revision" == "$SOURCE_SHA" ]]

  publish:
    needs: [plan, ci, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out captured source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Recheck release state
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: bash scripts/plan-release.sh >/dev/null
      - name: Create the release manifest
        env:
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cp infra/production/compose.yaml release-assets/compose.yaml
          cp infra/production/telegram.caddy release-assets/telegram.caddy
          node scripts/release-contract.mjs manifest \
            --version "$VERSION" \
            --source-sha "$SOURCE_SHA" \
            --image-digest "$IMAGE_DIGEST" \
            --compose release-assets/compose.yaml \
            --caddy release-assets/telegram.caddy \
            --run-id "$GITHUB_RUN_ID" \
            --server-url "$GITHUB_SERVER_URL" \
            >release-assets/release-manifest.json
          cat release-assets/release-manifest.json
      - name: Publish the immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          jq --raw-output '
            "Source: `" + .source.sha + "`\n\n" +
            "Image: `" + .image + "`\n\n" +
            "Migrations: `" + .migrations.identity + "` (" +
              (.migrations.count | tostring) + ", latest `" + .migrations.latest + "`)\n\n" +
            "Compose: `" + .compose.sha256 + "`\n\n" +
            "Caddy: `" + .caddy.sha256 + "`"
          ' release-assets/release-manifest.json >"$RUNNER_TEMP/release-notes.md"
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest \
            release-assets/release-manifest.json \
            release-assets/compose.yaml \
            release-assets/telegram.caddy
          # GITHUB_TOKEN cannot read the repository setting, so the created release proves it.
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --json isImmutable,tagName,targetCommitish >"$RUNNER_TEMP/published-release.json"
          if ! jq --exit-status '.isImmutable == true' "$RUNNER_TEMP/published-release.json" >/dev/null; then
            gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            echo "::error::Release $VERSION was created mutable and has been deleted with its tag. Enable immutable releases (Settings → General → Releases), then run this workflow again with $VERSION."
            exit 1
          fi
          jq --exit-status --arg version "$VERSION" --arg sha "$SOURCE_SHA" '
            .tagName == $version and .targetCommitish == $sha
          ' "$RUNNER_TEMP/published-release.json" >/dev/null
