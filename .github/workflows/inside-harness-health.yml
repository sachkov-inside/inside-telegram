name: Inside harness health

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  health:
    # Workspace checks its canonical package in its own CI. Every other repository checks its
    # installed snapshot against the Workspace release tag of the version it installed.
    if: github.repository != 'sachkov-inside/workspace'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the product harness at its installed version
        run: |
          set -euo pipefail
          version="$(jq --exit-status --raw-output .version .inside-harness/product-harness.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Installed harness version is not a release version: $version" >&2
            exit 1
          fi
          git clone --quiet --depth 1 --branch "inside-engineering-v${version}" \
            https://github.com/sachkov-inside/workspace.git "$RUNNER_TEMP/workspace"
          python3 "$RUNNER_TEMP/workspace/harness/bin/inside-harness" health .
