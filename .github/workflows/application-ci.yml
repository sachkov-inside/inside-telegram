name: Application CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      source_sha:
        description: Exact commit verified before a release
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A newer push to the same pull request supersedes its run. Push and release runs of one SHA
    # sit in separate groups, so neither replaces the other.
    concurrency:
      group: telegram-ci-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.source_sha || github.sha }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    services:
      rabbitmq:
        image: rabbitmq:4.3-management-alpine
        ports:
          - 5673:5672
          - 15673:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: inside_telegram
          POSTGRES_PASSWORD: inside
          POSTGRES_USER: inside
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inside -d inside_telegram"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://inside:inside@127.0.0.1:5432/inside_telegram
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify application
        run: pnpm check:full
