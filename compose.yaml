name: inside-telegram

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: inside_telegram
      POSTGRES_PASSWORD: inside
      POSTGRES_USER: inside
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inside -d inside_telegram"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
